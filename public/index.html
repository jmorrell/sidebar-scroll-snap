    <script>
      window.addEventListener("load", function () {
        let main = document.querySelector(".main");
        let scroller = document.querySelector(".container");
        let sidebar = document.querySelector(".sidebar");
        let sidebarWidth = sidebar.offsetWidth;
        let containerChildren = [main, sidebar];

        // Start with .main scrolled into view
        main.scrollIntoView({ behavior: "instant" });

        // if we aren't clicking on the sidebar, and main is not snapped
        // scroll back to main
        scroller.onpointerup = (event) => {
          if (!sidebar.contains(event.target) && !main.classList.contains("snapped")) {
            main.scrollIntoView({ behavior: "smooth" });
          }
        };

        if (!("onscrollsnapchange" in scroller)) {
          scroller.onscroll = (event) => {
            if (scroller.onscrollsnapchange) {
              if (Math.abs(scroller.scrollLeft) <= 2) {
                scroller.onscrollsnapchange({
                  snapTargetInline: scroller.scrollLeft == sidebarWidth ? main : sidebar,
                });
              } else if (Math.abs(scroller.scrollLeft - sidebarWidth) <= 2) {
                scroller.onscrollsnapchange({
                  snapTargetInline: scroller.scrollLeft == sidebarWidth ? main : sidebar,
                });
              }
            }
          };
        }

        scroller.onscrollsnapchange = (event) => {
          console.log("onscrollsnapchange");
          scroller.querySelector(":scope .snapped")?.classList.remove("snapped");
          event.snapTargetInline.classList.add("snapped");
          containerChildren.forEach((child) => {
            if (child !== event.snapTargetInline) {
              child.ariaHidden = true;
              child.inert = true;
            } else {
              child.ariaHidden = false;
              child.inert = false;
            }
          });
        };
      });
    </script>
