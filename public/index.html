    <script>
      window.addEventListener("load", function () {
        let main = document.querySelector(".main");
        let scroller = document.querySelector(".container");
        let sidebar = document.querySelector(".sidebar");
        let menuButton = document.querySelector(".menu-icon-button");
        let header = document.querySelector(".grid-header");
        let sidebarWidth = sidebar.offsetWidth;
        let containerChildren = [main, sidebar];
        let hasOnScrollSnapChange = "onscrollsnapchange" in scroller;

        // Start with .main scrolled into view
        main.scrollIntoView({ behavior: "instant" });

        // if we aren't clicking on the sidebar, and main is not snapped
        // scroll back to main
        scroller.onclick = (event) => {
          if (!sidebar.contains(event.target) && !main.classList.contains("snapped")) {
            main.scrollIntoView({ behavior: "smooth" });
          }
        };

        header.ontouchend = (event) => {
          console.log("header clicked");
          document.querySelector(".grid-container").scrollTo({ top: 0, behavior: "smooth" });
        };

        menuButton.onclick = (event) => {
          if (main.classList.contains("snapped")) {
            sidebar.scrollIntoView({ behavior: "smooth" });
          }
        };

        scroller.onscroll = (event) => {
          let scrollLeft = scroller.scrollLeft;

          // if we've scrolled away from the main section, remove snapped
          if (Math.abs(scrollLeft - sidebarWidth) <= 80) {
            main.classList.remove("snapped");
            main.inert = true;
            main.ariaHidden = true;
            sidebar.inert = false;
            sidebar.ariaHidden = false;
          }

          // if we've scrolled away from the sidebar, remove snapped
          if (Math.abs(scrollLeft) > 80) {
            sidebar.classList.remove("snapped");
            sidebar.inert = false;
            sidebar.ariaHidden = false;
            main.inert = true;
            main.ariaHidden = true;
          }

          // If we've snapped to the sidebar, add snapped
          if (Math.abs(scrollLeft) <= 10) {
            sidebar.classList.add("snapped");
            sidebar.inert = false;
            sidebar.ariaHidden = false;
            main.inert = true;
            main.ariaHidden = true;
            main.classList.remove("snapped");
          } else if (Math.abs(scrollLeft - sidebarWidth) <= 10) {
            main.classList.add("snapped");
            main.inert = false;
            main.ariaHidden = false;
            sidebar.inert = true;
            sidebar.ariaHidden = true;
            sidebar.classList.remove("snapped");
          }
        };
      });
    </script>
